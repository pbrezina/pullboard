[package]
name = "pullboard-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Shared strict YAML configuration and bounded read-only HTTP for PullBoard"

[features]
default = []
native-keyring = ["dep:keyring"]
api = ["dep:axum"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true, default-features = false, features = ["json"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
http = "1"
httpdate = "1"
keyring = { version = "3.6", optional = true, features = ["async-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"
zeroize = "1"

[dev-dependencies]
futures-util = "0.3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
