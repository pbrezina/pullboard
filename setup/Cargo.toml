[package]
name = "pullboard-setup"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Disposable rootless Linux setup wizard for PullBoard"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
http = "1"
pullboard-core = { path = "../crates/pullboard-core" }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "1", features = ["fs", "process", "termios"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
unicode-width = "0.2"
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
