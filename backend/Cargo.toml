[package]
name = "pullboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
description = "Local, read-only forge dashboard with explicitly submitted Jira actions"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
gitlab = "0.1905"
globset = "0.4"
getrandom = "0.3.4"
http = "1"
http-body-util = "0.1"
httpdate = "1"
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }
octocrab = { version = "0.54", default-features = false, features = ["default-client", "rustls", "rustls-ring", "timeout"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
zeroize = "1"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
