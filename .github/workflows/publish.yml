name: Publish versioned image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ghcr:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Normalize registry path
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=raw,value=${{ env.VERSION }}
          flavor: latest=true
          labels: org.opencontainers.image.licenses=GPL-3.0-or-later
      - name: Build candidate locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: localhost/pullboard:release-candidate
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: make smoke CONTAINER_ENGINE=docker IMAGE=localhost/pullboard:release-candidate
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag localhost/pullboard:release-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
