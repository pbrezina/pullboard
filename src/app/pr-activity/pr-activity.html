<span class="created"
  >Created:
  <strong>
    @if (pr().createdAt; as date) {
      <time [attr.datetime]="date" [title]="timestamp(date)">{{ date | date: 'yyyy-MM-dd' }}</time>
    } @else {
      Unknown
    }
  </strong> </span
>,
<span class="last-activity"
  >Last activity:
  <strong
    ><time [attr.datetime]="pr().updatedAt" [title]="timestamp(pr().updatedAt)">{{
      age(pr().updatedAt)
    }}</time></strong
  >
</span>
@if (waitingSince(); as since) {
  ,
  <span class="waiting-since"
    >Waiting since:
    <strong
      ><time [attr.datetime]="since" [title]="timestamp(since)">{{ age(since) }}</time></strong
    >
  </span>
} @else if (requestTimeUnknown()) {
  ,
  <span class="waiting-since"
    >Waiting since:
    <strong title="Request time unavailable; sorted by last activity">Unknown</strong></span
  >
}
