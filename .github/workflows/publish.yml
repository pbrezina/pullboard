name: Publish image and setup

on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  ghcr:
    if: github.event_name == 'push' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
      - name: Identify build
        id: version
        run: echo "version=$(git describe --tags --match 'v[0-9]*' --always --abbrev=12)" >> "$GITHUB_OUTPUT"
      - name: Normalize registry path
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
          flavor: latest=${{ github.event_name == 'release' }}
          labels: org.opencontainers.image.licenses=GPL-3.0-or-later
      - name: Build candidate locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: localhost/pullboard:publish-candidate
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: PULLBOARD_BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: make smoke CONTAINER_ENGINE=docker IMAGE=localhost/pullboard:publish-candidate
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        id: publish
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            master_sha="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
            if [ "$master_sha" != "$GITHUB_SHA" ]; then
              echo '::notice::Skipping superseded nightly image; master has advanced.'
              exit 0
            fi
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag localhost/pullboard:publish-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          echo 'published=true' >> "$GITHUB_OUTPUT"

  setup:
    if: github.event_name == 'push' || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    uses: ./.github/workflows/setup-build.yml
    with:
      ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

  setup-assets:
    name: Publish setup only after matching image
    needs: [ghcr, setup]
    if: needs.ghcr.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: pullboard-setup
          path: ${{ runner.temp }}/setup-release
      - name: Verify transferred assets
        working-directory: ${{ runner.temp }}/setup-release
        run: sha256sum -c SHA256SUMS
      - name: Attach versioned assets or update rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            master_sha="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
            if [ "$master_sha" != "$GITHUB_SHA" ]; then
              echo '::notice::Skipping superseded nightly setup assets; master has advanced.'
              exit 0
            fi
            RELEASE_TAG=nightly
            notes="Rolling development setup and source for commit $GITHUB_SHA. The matching :nightly image passed smoke tests and was published first. SHA256SUMS detects corruption, not independent publisher authenticity. Linux x86-64 only."
            if gh release view nightly >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true
              gh release edit nightly --prerelease --latest=false --title 'Nightly' --notes "$notes"
            else
              gh release create nightly --target "$GITHUB_SHA" --prerelease --latest=false --title 'Nightly' --notes "$notes"
            fi
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/setup-release/"* --clobber
          # GITHUB_TOKEN-created releases do not start another workflow; the image
          # job also explicitly excludes the non-v nightly tag and prereleases.
