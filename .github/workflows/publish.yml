name: Publish image

on:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  ghcr:
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Normalize registry path
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
          flavor: latest=${{ github.event_name == 'release' }}
          labels: org.opencontainers.image.licenses=GPL-3.0-or-later
      - name: Build candidate locally
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: localhost/pullboard:publish-candidate
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: make smoke CONTAINER_ENGINE=docker IMAGE=localhost/pullboard:publish-candidate
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            master_sha="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
            if [ "$master_sha" != "$GITHUB_SHA" ]; then
              echo '::notice::Skipping superseded nightly image; master has advanced.'
              exit 0
            fi
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag localhost/pullboard:publish-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
