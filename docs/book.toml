[book]
title = "PullBoard"
authors = ["PullBoard contributors"]
description = "Local attention, explicit actions: user, operator and contributor guide"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false
extra-watch-dirs = ["../config", "../api"]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
